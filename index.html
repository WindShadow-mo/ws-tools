<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ws-tools · 在线工具集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    color: #333;
    min-height: 100vh;
  }

  /* 顶栏 */
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 48px 24px 40px;
    text-align: center;
  }
  .header h1 { font-size: 30px; font-weight: 700; letter-spacing: 2px; }
  .header .subtitle {
    margin-top: 10px;
    font-size: 15px;
    opacity: .85;
    line-height: 1.7;
  }
  .header .author {
    display: inline-block;
    margin-top: 14px;
    font-size: 13px;
    opacity: .7;
    letter-spacing: 1px;
  }
  .header .tool-count {
    display: inline-block;
    margin-top: 18px;
    padding: 5px 16px;
    background: rgba(255,255,255,.18);
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 1px;
  }

  /* 主体 */
  .container {
    max-width: 960px;
    margin: 32px auto;
    padding: 0 20px 60px;
  }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: #888;
    letter-spacing: 2px;
    margin-bottom: 20px;
    padding-left: 4px;
  }

  /* 工具卡片网格 */
  .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }
  .tool-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
    padding: 28px 24px 22px;
    display: flex;
    flex-direction: column;
    transition: all .2s;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
  }
  .tool-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    opacity: 0;
    transition: opacity .2s;
  }
  .tool-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(102,126,234,.18);
  }
  .tool-card:hover::before { opacity: 1; }

  .tool-icon {
    font-size: 40px;
    margin-bottom: 16px;
    line-height: 1;
  }
  .tool-name {
    font-size: 17px;
    font-weight: 600;
    color: #222;
    margin-bottom: 8px;
  }
  .tool-desc {
    font-size: 13px;
    color: #666;
    line-height: 1.6;
    flex: 1;
    margin-bottom: 16px;
  }
  .tool-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .tool-tag {
    padding: 2px 9px;
    background: #f0f3ff;
    color: #667eea;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .tool-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    border-top: 1px solid #f0f0f0;
    padding-top: 12px;
  }
  .tool-enter {
    font-size: 13px;
    font-weight: 600;
    color: #667eea;
  }

  /* 空状态 / 错误 */
  .placeholder {
    text-align: center;
    padding: 80px 20px;
    color: #aaa;
  }
  .placeholder .ph-icon { font-size: 48px; margin-bottom: 16px; }
  .placeholder p { font-size: 14px; line-height: 1.8; }
  .placeholder code {
    background: #f0f0f0;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 13px;
    color: #555;
  }

  /* 页脚 */
  .footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: #bbb;
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="projectName">ws-tools</h1>
  <div class="subtitle" id="projectDesc">在线工具集合，提供各类实用的前端小工具，开箱即用</div>
  <div class="author" id="projectAuthor"></div>
  <div class="tool-count" id="toolCount">加载中…</div>
</div>

<div class="container">
  <div class="section-title">全部工具</div>
  <div class="tool-grid" id="toolGrid"></div>
  <div class="placeholder" id="placeholder" style="display:none;">
    <div class="ph-icon">📂</div>
    <p id="placeholderText">正在加载工具列表…</p>
  </div>
</div>

<div class="footer">ws-tools · 所有工具均在浏览器本地运行，不上传任何数据</div>

<script src="tools.js"></script>
<script>
function init() {
  const grid        = document.getElementById('toolGrid');
  const placeholder = document.getElementById('placeholder');
  const phText      = document.getElementById('placeholderText');
  const countEl     = document.getElementById('toolCount');
  const descEl      = document.getElementById('projectDesc');

  const data  = WS_TOOLS || {};
  const tools = data.tools || [];

  // 更新项目信息
  if (data.project)     document.getElementById('projectName').textContent    = data.project;
  if (data.description) descEl.textContent                                    = data.description;
  if (data.author)      document.getElementById('projectAuthor').textContent  = `author: ${data.author}`;
  countEl.textContent = `共 ${tools.length} 个工具`;

  if (tools.length === 0) {
    placeholder.style.display = 'block';
    grid.style.display = 'none';
    phText.textContent = '暂无工具，请在 tools.js 中添加配置';
    return;
  }

  grid.innerHTML = tools.map(tool => {
    const tags = (tool.tags || []).map(t => `<span class="tool-tag">${t}</span>`).join('');
    return `
      <a class="tool-card" href="${tool.href}" target="_blank">
        <div class="tool-icon">${tool.icon || '🔧'}</div>
        <div class="tool-name">${tool.name}</div>
        <div class="tool-desc">${tool.description || ''}</div>
        <div class="tool-tags">${tags}</div>
        <div class="tool-footer">
          <span class="tool-enter">进入 →</span>
        </div>
      </a>
    `;
  }).join('');
}

init();
</script>
</body>
</html>
